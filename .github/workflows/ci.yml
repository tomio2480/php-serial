name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # 開発中の PHP は不具合を含みうるため、失敗してもワークフロー全体を落とさない。
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        include:
          # setup-php は '8.6' に PHP-8.6 ブランチの nightly を入れる。
          # 8.6.0 の GA 後に stable へ切り替わったら、この指定を外して必須にする。
          - php: '8.6'
            experimental: true

    name: PHP ${{ matrix.php }} - ${{ matrix.os }}${{ matrix.experimental && ' (experimental)' || '' }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: ffi
        coverage: none

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer test

  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: ffi
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHP_CodeSniffer
      run: composer cs:check

    - name: Run PHP-CS-Fixer
      run: composer cs:fixer

    - name: Run PHPStan
      run: composer stan
