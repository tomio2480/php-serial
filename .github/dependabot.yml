version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # 結合テストで使う serdevmock と pyserial（版とハッシュを固定している）
  - package-ecosystem: "pip"
    directory: "/tests/Integration"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5