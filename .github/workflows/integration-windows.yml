name: Integration (Windows)

# com0com の仮想 COM ポート対と serdevmock を使い、FFI 実装の送受信を実機なしで確かめる。
# FFI 実装に関係しない変更まで走らせないよう、macOS 版と同じく実行の機会を絞る。
on:
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:00（日本時間）
    - cron: '0 18 * * 0'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/integration-windows.yml'
      - 'tests/Integration/**'
      - 'tests/fixtures/serdevmock/**'
      - 'tests/fixtures/windows/**'
      - 'src/PhpSerial/Platform/Windows*.php'

permissions:
  contents: read

jobs:
  serdevmock:
    name: serdevmock - windows-latest
    runs-on: windows-latest
    # 相手が読まないと write() が戻らない経路があるため、上限を設けて CI を止めない
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      # SourceForge の com0com 3.0.0.0 署名版。ハッシュが合わなければ導入しない
      COM0COM_ZIP_URL: https://sourceforge.net/projects/com0com/files/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip/download
      COM0COM_ZIP_SHA256: 6e5d4359865277430d4ae88c73fb7e648a0ed8e81aea5002478179cfcb0bb0e1
      COM0COM_SETUP: Setup_com0com_v3.0.0.0_W7_x64_signed.exe
      APP_PORT: COM10
      MOCK_PORT: COM11

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: ffi
        ini-values: ffi.enable=true
        coverage: none

    # FFI が無効だと SerialPort は fopen 版へ切り替わり、FFI 実装を試験しないまま通ってしまう
    - name: Check FFI
      run: |
        $info = php --ri ffi
        if ($LASTEXITCODE -ne 0) {
          throw 'FFI 拡張が読み込まれていない'
        }
        $info
        if (-not ($info -match '^ffi\.enable => (true|on|1)\b')) {
          throw 'ffi.enable が有効になっていない'
        }

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install serdevmock
      run: python -m pip install --require-hashes -r tests/Integration/requirements.txt

    # ホストランナーは Secure Boot が無効のため、2016 年の証明書で署名されたドライバーも読み込める
    - name: Install com0com
      id: com0com
      timeout-minutes: 3
      run: |
        $work = Join-Path $env:RUNNER_TEMP 'com0com'
        $installDir = Join-Path $work 'install'
        $zip = Join-Path $work 'com0com.zip'
        New-Item -ItemType Directory -Force $work | Out-Null

        curl.exe -fsSL --retry 3 -o $zip $env:COM0COM_ZIP_URL
        $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
        if ($hash -ne $env:COM0COM_ZIP_SHA256) {
          throw "com0com の SHA256 が一致しない: $hash"
        }

        Expand-Archive -Path $zip -DestinationPath (Join-Path $work 'zip')
        $setup = Join-Path $work "zip\$env:COM0COM_SETUP"

        # 発行元を信頼済みにしておかないと、ドライバー導入の確認ダイアログで止まる。
        # 使い捨てのランナーに限った操作であり、手元では行わない
        $cert = (Get-AuthenticodeSignature $setup).SignerCertificate
        $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher', 'LocalMachine')
        $store.Open('ReadWrite')
        try {
          $store.Add($cert)
        } finally {
          $store.Close()
        }

        $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
        if ($p.ExitCode -ne 0) {
          throw "com0com のインストーラーが失敗した: $($p.ExitCode)"
        }

        Push-Location $installDir
        try {
          .\setupc.exe --silent install "PortName=$env:APP_PORT" "PortName=$env:MOCK_PORT"
          if ($LASTEXITCODE -ne 0) {
            throw "setupc が失敗した: $LASTEXITCODE"
          }
          .\setupc.exe list
        } finally {
          Pop-Location
        }

        $ports = [System.IO.Ports.SerialPort]::GetPortNames()
        foreach ($name in $env:APP_PORT, $env:MOCK_PORT) {
          if ($ports -notcontains $name) {
            throw "$name が見つからない: $($ports -join ', ')"
          }
        }

    # Windows のランナーは、ステップ内で起動したプロセスをステップの終わりに止める。
    # このため serdevmock の起動・試験・停止を 1 つのステップで行う。
    # 環境変数が欠けて全件が飛ばされたまま緑になるのを防ぐため、skip と空を失敗として扱う
    - name: Run integration tests with serdevmock
      timeout-minutes: 3
      env:
        SERDEVMOCK_PORT: ${{ env.APP_PORT }}
      run: |
        $work = Join-Path $env:RUNNER_TEMP 'serdevmock'
        try {
          ./tests/Integration/start-serdevmock.ps1 -AppPort $env:APP_PORT -MockPort $env:MOCK_PORT -WorkDir $work
          php vendor/bin/phpunit --group integration --testdox --fail-on-skipped --fail-on-empty-test-suite
          $code = $LASTEXITCODE
        } finally {
          ./tests/Integration/stop-serdevmock.ps1 -WorkDir $work
        }
        exit $code

    # serdevmock を止めた後の COM10 は、相手が読まないポートになる
    - name: Run idle port tests
      if: ${{ !cancelled() && steps.com0com.outcome == 'success' }}
      timeout-minutes: 3
      env:
        WINDOWS_IDLE_PORT: ${{ env.APP_PORT }}
      run: >-
        php vendor/bin/phpunit --group windows-idle-port --testdox
        --fail-on-skipped --fail-on-empty-test-suite
