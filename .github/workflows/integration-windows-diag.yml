name: Integration (Windows diag)

# TEMP: 原因調査用。PR 作成前に削除する。
on:
  push:
    branches: [ 'claude/ci-windows-integration-*' ]

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      COM0COM_ZIP_URL: https://sourceforge.net/projects/com0com/files/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip/download
      COM0COM_ZIP_SHA256: 6e5d4359865277430d4ae88c73fb7e648a0ed8e81aea5002478179cfcb0bb0e1
      COM0COM_SETUP: Setup_com0com_v3.0.0.0_W7_x64_signed.exe
      APP_PORT: COM20
      MOCK_PORT: COM21

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: ffi
        ini-values: ffi.enable=true
        coverage: none

    - run: composer install --prefer-dist --no-progress

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - run: python -m pip install --require-hashes -r tests/Integration/requirements.txt

    - name: Install com0com
      id: com0com
      timeout-minutes: 3
      run: |
        $work = Join-Path $env:RUNNER_TEMP 'com0com'
        $installDir = Join-Path $work 'install'
        $zip = Join-Path $work 'com0com.zip'
        New-Item -ItemType Directory -Force $work | Out-Null

        curl.exe -fsSL --retry 3 -o $zip $env:COM0COM_ZIP_URL
        $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
        if ($hash -ne $env:COM0COM_ZIP_SHA256) {
          throw "com0com の SHA256 が一致しない: $hash"
        }

        Expand-Archive -Path $zip -DestinationPath (Join-Path $work 'zip')
        $setup = Join-Path $work "zip\$env:COM0COM_SETUP"

        # 発行元を信頼済みにしておかないと、ドライバー導入の確認ダイアログで止まる。
        # 使い捨てのランナーに限った操作であり、手元では行わない
        $cert = (Get-AuthenticodeSignature $setup).SignerCertificate
        $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('TrustedPublisher', 'LocalMachine')
        $store.Open('ReadWrite')
        try {
          $store.Add($cert)
        } finally {
          $store.Close()
        }

        $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
        if ($p.ExitCode -ne 0) {
          throw "com0com のインストーラーが失敗した: $($p.ExitCode)"
        }

        Push-Location $installDir
        try {
          .\setupc.exe --silent install "PortName=$env:APP_PORT" "PortName=$env:MOCK_PORT"
          if ($LASTEXITCODE -ne 0) {
            throw "setupc が失敗した: $LASTEXITCODE"
          }
          .\setupc.exe list
        } finally {
          Pop-Location
        }

        $ports = [System.IO.Ports.SerialPort]::GetPortNames()
        foreach ($name in $env:APP_PORT, $env:MOCK_PORT) {
          if ($ports -notcontains $name) {
            throw "$name が見つからない: $($ports -join ', ')"
          }
        }


    - name: 1 fresh COM21 and COM20
      timeout-minutes: 1
      run: |
        php tests/Integration/diag-dcb.php COM21
        php tests/Integration/diag-dcb.php COM20

    - name: 2 start serdevmock on COM21
      run: |
        $env:PYTHONIOENCODING = 'utf-8'
        $env:PYTHONUNBUFFERED = '1'
        $exe = (Get-Command serdevmock -CommandType Application).Source
        $d = Join-Path $env:RUNNER_TEMP 'sdm'
        New-Item -ItemType Directory -Force $d | Out-Null
        $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -WorkingDirectory tests/fixtures/serdevmock `
          -ArgumentList '--protocol', 'uart', '--port', 'COM21', '--config', 'echo.json' `
          -RedirectStandardOutput (Join-Path $d 'out.log') -RedirectStandardError (Join-Path $d 'err.log')
        Set-Content (Join-Path $d 'pid') $p.Id
        Start-Sleep -Seconds 5
        "alive: $(-not $p.HasExited)"
        Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'python|serdevmock' } | Format-Table ProcessId, ParentProcessId, Name -AutoSize

    - name: 3 COM20 write with serdevmock (PHP raw)
      timeout-minutes: 1
      run: php tests/Integration/diag-dcb.php COM20 write

    - name: 4 .NET probe on COM20
      timeout-minutes: 1
      run: |
        $a = [System.IO.Ports.SerialPort]::new('COM20', 9600)
        $a.NewLine = "`n"; $a.ReadTimeout = 2000; $a.WriteTimeout = 2000
        $a.Open()
        "dtr=$($a.DtrEnable) rts=$($a.RtsEnable) cts=$($a.CtsHolding) dsr=$($a.DsrHolding) cd=$($a.CDHolding)"
        try { $a.WriteLine('probe'); "written" } catch { "write failed: $_" }
        try { "got: $($a.ReadLine())" } catch { "read failed: $_" }
        $a.Close()

    - name: 5 COM20 after .NET (PHP raw)
      timeout-minutes: 1
      run: php tests/Integration/diag-dcb.php COM20 write

    - name: 6 phpunit
      continue-on-error: true
      timeout-minutes: 3
      env:
        SERDEVMOCK_PORT: COM20
      run: php vendor/bin/phpunit --group integration --testdox

    - name: 7 COM20 after phpunit (PHP raw)
      timeout-minutes: 1
      run: php tests/Integration/diag-dcb.php COM20 write

    - name: Logs
      if: always()
      run: |
        $d = Join-Path $env:RUNNER_TEMP 'sdm'
        $id = [int](Get-Content (Join-Path $d 'pid'))
        "serdevmock alive: $($null -ne (Get-Process -Id $id -ErrorAction SilentlyContinue))"
        foreach ($n in 'out.log', 'err.log') {
          "----- $n"
          Get-Content (Join-Path $d $n) -Encoding utf8
        }
