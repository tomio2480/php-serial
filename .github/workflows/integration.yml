name: Integration

# socat の仮想ポート対と serdevmock を使い、実機なしで送受信を確かめる。
# macOS は空き待ちが長くなることがあるため integration-macos.yml へ分けている。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  serdevmock:
    name: serdevmock - ubuntu-latest
    runs-on: ubuntu-latest
    # 相手が読まないと write() が戻らない経路があるため、上限を設けて CI を止めない
    timeout-minutes: 10
    env:
      SERDEVMOCK_PORT: /dev/ttyUSB90

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install socat
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends socat

    - name: Install serdevmock
      run: python -m pip install --require-hashes -r tests/Integration/requirements.txt

    - name: Start serdevmock
      run: bash tests/Integration/start-serdevmock.sh "$SERDEVMOCK_PORT" "$RUNNER_TEMP/serdevmock"

    # 環境変数が欠けて全件が飛ばされたまま緑になるのを防ぐため、skip と空を失敗として扱う
    - name: Run integration tests
      timeout-minutes: 3
      run: >-
        vendor/bin/phpunit --group integration --testdox
        --fail-on-skipped --fail-on-empty-test-suite

    - name: Stop serdevmock
      if: always()
      run: bash tests/Integration/stop-serdevmock.sh "$SERDEVMOCK_PORT" "$RUNNER_TEMP/serdevmock"
